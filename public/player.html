<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Lotería digital — Mi cartón</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<script src="/socket.io/socket.io.js"></script>
<style>
  :root{
    --paper: #f3ecd9;
    --paper-line: #e2d5b3;
    --maroon: #8b5cf6;
    --maroon-deep: #170b2c;
    --gold: #c9a6ff;
    --magenta: #e879f9;
    --grad: linear-gradient(90deg, #9b5cf6, #d946ef);
    --grad-text: linear-gradient(180deg, #f6f0ff 0%, #cdaaff 55%, #e879f9 100%);
    --ink: #2b2416;
    --mist: #8a7f66;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html,body{
    margin:0; min-height:100%;
    background: var(--maroon-deep);
    font-family:'Space Grotesk', sans-serif;
    color: var(--ink);
  }
  .num-font{ font-family:'Fraunces', serif; font-variation-settings:'opsz' 60; }
  .screen{ min-height:100dvh; display:flex; flex-direction:column; }
  .hidden{ display:none !important; }

  .brandbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 18px; background: var(--maroon-deep);
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .brandbar img{ height:20px; display:block; }
  .brandbar .flag-chip{
    display:flex; align-items:center; gap:6px;
    font-size:12px; color:#f3ecd9; background:rgba(255,255,255,0.09);
    padding:6px 12px; border-radius:999px; white-space:nowrap;
  }

  /* ---------- Pantalla: unirse ---------- */
  #joinScreen{
    flex:1; display:flex; flex-direction:column; justify-content:center;
    padding: 32px 26px; gap:18px; color:#f3ecd9;
  }
  #joinScreen h1{ font-size:28px; margin:0 0 4px; font-weight:600; }
  #joinScreen h1 b{ color: var(--gold); }
  #joinScreen p{ margin:0 0 10px; color:#d8c9a8; font-size:14px; }
  #joinScreen input{
    padding: 14px 16px; border-radius: 12px; border:none; font-size:16px;
    background: #f3ecd9; color: var(--ink);
  }
  #joinScreen button{
    padding:15px; border-radius:12px; border:none; background: var(--grad);
    color:#fff; font-size:16px; font-weight:600; margin-top:6px;
  }
  #joinError{ color:#ffb3b3; font-size:13px; min-height:16px; }

  /* ---------- Pantalla: elegir cartón ---------- */
  #pickScreen{ flex:1; display:flex; flex-direction:column; }
  .pick-header{ background: var(--maroon-deep); color:#f3ecd9; padding: 18px 20px; text-align:center; }
  .pick-header .pick-title{ font-size:20px; font-weight:600; }
  .pick-header .pick-sub{ font-size:12px; color:#d8c9a8; margin-top:4px; }

  .pick-body{
    flex:1; background: var(--paper); border-radius: 22px 22px 0 0;
    padding: 18px 14px 20px; display:flex; flex-direction:column; gap:16px; min-height:0;
  }
  .pick-grid{
    display:grid; grid-template-columns: repeat(6, 1fr); gap:8px;
    max-height: 30vh; overflow-y:auto; padding:4px;
  }
  .pick-badge{
    aspect-ratio:1; border-radius:10px; border:none;
    font-family:'Space Grotesk',sans-serif; font-size:13px; font-weight:600;
    background:#fffaf0; color:var(--ink); cursor:pointer;
  }
  .pick-badge.taken{ background:#d8cbb0; color:#a89878; }
  .pick-badge.selected{ outline:3px solid var(--maroon); background:var(--grad); color:#fff; }

  .pick-preview{ display:flex; flex-direction:column; gap:8px; }
  .preview-label{ font-size:13px; color:var(--mist); font-weight:600; }

  .pick-actions{ display:flex; gap:10px; margin-top:auto; }
  .btn-ghost-paper{
    flex:1; padding:14px; border-radius:12px; border:1px solid var(--paper-line);
    background:transparent; color:var(--ink); font-weight:600; font-size:14px;
  }
  .btn-primary-paper{
    flex:1; padding:14px; border-radius:12px; border:none;
    background: var(--maroon); color:#f3ecd9; font-weight:600; font-size:14px;
  }
  .btn-primary-paper:disabled{ opacity:0.4; }

  /* ---------- Pantalla: juego ---------- */
  #gameScreen{ flex:1; display:flex; flex-direction:column; }
  .top-banner{
    background: var(--maroon-deep); color:#f3ecd9;
    padding: 16px 20px 20px; text-align:center;
  }
  .top-banner .label{ font-size:12px; color:#d8c9a8; letter-spacing:0.5px; }
  .top-banner .big-number{
    font-size:56px; line-height:1.1;
    background: var(--grad-text); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .top-banner .sub{ font-size:12px; color:#c8b78f; }
  .history-strip{
    display:flex; gap:6px; overflow-x:auto; padding: 0 20px 14px; background: var(--maroon-deep);
  }
  .history-strip span{
    flex:0 0 auto; width:26px; height:26px; border-radius:50%;
    background: rgba(255,255,255,0.12); color:#f3ecd9;
    display:flex; align-items:center; justify-content:center; font-size:11px;
  }

  .card-wrap{ flex:1; background: var(--paper); border-radius: 22px 22px 0 0; padding: 20px 14px 30px; }
  .card-header{ display:flex; justify-content:space-between; align-items:center; padding: 0 6px 14px; }
  .card-header .name{ font-weight:600; font-size:15px; }
  .card-header .room{ font-size:12px; color: var(--mist); }

  .carton{
    display:grid;
    grid-template-columns: repeat(9, 1fr);
    gap: 5px;
    background: var(--paper-line);
    padding: 6px;
    border-radius: 14px;
  }
  .cell{
    aspect-ratio: 1;
    display:flex; align-items:center; justify-content:center;
    border-radius: 7px;
    font-size: clamp(15px, 5vw, 21px);
    font-weight: 600;
    background: #fffaf0;
    color: var(--ink);
    position: relative;
    user-select: none;
  }
  .cell.blank{ background: var(--maroon); }
  .cell.playable{ cursor:pointer; }
  .cell.marked{
    background: var(--maroon);
    color: #fff;
  }
  .cell.marked::after{
    content:'';
    position:absolute; inset: 5%;
    border-radius: 50%;
    border: 2px solid var(--magenta);
  }
  .cell.shake{ animation: shake .3s; }
  @keyframes shake{
    25%{ transform: translateX(-4px);} 75%{ transform: translateX(4px);}
  }
  .cell.attention{ animation: cellAttention .5s ease-in-out 2; }
  @keyframes cellAttention{
    0%, 100%{ background:#fffaf0; box-shadow:none; }
    50%{ background: var(--magenta); box-shadow: 0 0 0 6px rgba(232,121,249,0.45); }
  }

  .status-strip{
    display:flex; justify-content:space-between; margin-top:16px; padding:0 6px;
    font-size:12px; color: var(--mist);
  }

  #toast{
    position: fixed; left:50%; bottom: 28px; transform: translateX(-50%) translateY(20px);
    background: var(--ink); color:#f3ecd9; padding: 14px 22px; border-radius: 30px;
    font-size:14px; opacity:0; transition: all .25s ease; pointer-events:none;
    text-align:center; max-width: 86%;
  }
  #toast.show{ opacity:1; transform: translateX(-50%) translateY(0); }
</style>
</head>

    <div class="flag-chip">🇨🇱 Fiestas Patrias</div>
  </div>

  <div id="joinScreen">
    <h1>Lotería <b>digital</b></h1>
    <p>Ingresa tu nombre para recibir tu cartón.</p>
    <input id="roomInput" placeholder="Código de sala (ej. K7QT)" maxlength="4" autocapitalize="characters" />
    <input id="nameInput" placeholder="Tu nombre" maxlength="24" />
    <div id="joinError"></div>
    <button id="joinBtn">Unirme a la sala</button>
  </div>

  <div id="pickScreen" class="hidden">
    <div class="pick-header">
      <div class="pick-title">Elige tu cartón</div>
      <div class="pick-sub"><span id="cardsAvailableTag">0</span> disponibles de <span id="cardsTotalTag">0</span></div>
    </div>
    <div class="pick-body">
      <div class="pick-grid hidden" id="pickGrid"></div>
      <div class="pick-preview">
        <div class="preview-label">Cartón <span id="previewIdTag">—</span></div>
        <div class="carton" id="previewCarton"></div>
      </div>
      <div class="pick-actions">
        <button id="shuffleBtn" class="btn-ghost-paper" type="button">🔀 Otro cartón</button>
        <button id="confirmCardBtn" class="btn-primary-paper" type="button" disabled>Confirmar cartón</button>
      </div>
    </div>
  </div>

  <div id="gameScreen" class="hidden">
    <div class="top-banner">
      <div class="label">Último número cantado</div>
      <div class="big-number num-font" id="lastNumber">—</div>
      <div class="sub">Toca ese número en tu cartón para marcarlo</div>
    </div>
    <div class="history-strip" id="historyStrip"></div>

    <div class="card-wrap">
      <div class="card-header">
        <div class="name" id="playerNameTag"></div>
        <div class="room">Sala <span id="roomTag"></span></div>
      </div>
      <div class="carton" id="carton"></div>
      <div class="status-strip">
        <span id="markedStatus">0/15 marcados</span>
        <span id="patternStatus"></span>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const socket = io();
let myCard = null;
let drawnNumbers = [];
let allCardsById = {};      // id -> grid
let cardsStatusById = {};   // id -> { taken, takenByName }
let candidateId = null;     // cartón que se está previsualizando (aún no confirmado)

const params = new URLSearchParams(location.search);
const roomFromUrl = (params.get('room') || '').toUpperCase();
if (roomFromUrl) document.getElementById('roomInput').value = roomFromUrl;

function showToast(msg, ms = 2600) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._h);
  showToast._h = setTimeout(() => t.classList.remove('show'), ms);
}

// ---------- Sesión persistente (para no perder el cartón al refrescar) ----------
const CLIENT_ID_KEY = 'loteriaDigital:clientId';
const SESSION_KEY = 'loteriaDigital:session';

function getClientId() {
  let id = localStorage.getItem(CLIENT_ID_KEY);
  if (!id) {
    id = (crypto.randomUUID ? crypto.randomUUID() : `c-${Date.now()}-${Math.random().toString(36).slice(2)}`);
    localStorage.setItem(CLIENT_ID_KEY, id);
  }
  return id;
}
const CLIENT_ID = getClientId();

function saveSession(roomCode, name) {
  localStorage.setItem(SESSION_KEY, JSON.stringify({ roomCode, name }));
}
function loadSession() {
  try {
    return JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
  } catch {
    return null;
  }
}
function clearSession() {
  localStorage.removeItem(SESSION_KEY);
}

function showScreen(id) {
  ['joinScreen', 'pickScreen', 'gameScreen'].forEach((s) => {
    document.getElementById(s).classList.toggle('hidden', s !== id);
  });
}

// Aplica en el DOM las celdas que el jugador ya tenía marcadas (al recuperar
// la sesión tras un refresh), sin depender de haber hecho click en ellas.
function applyMarkedCells(markedKeys) {
  markedKeys.forEach((key) => {
    const [row, col] = key.split('-').map(Number);
    const cellEl = document.querySelector(`#carton .cell[data-row="${row}"][data-col="${col}"]`);
    cellEl?.classList.add('marked');
  });
  const totalPlayable = myCard ? myCard.flat().filter((v) => v != null).length : 15;
  document.getElementById('markedStatus').textContent = `${markedKeys.length}/${totalPlayable} marcados`;
}

// Corre en CADA conexión del socket, no solo la primera: un corte de red
// breve (WiFi que titubea, el celular cambiando de red, la pestaña en
// segundo plano) hace que Socket.IO reconecte solo con un socket.id
// nuevo — sin este handshake, el servidor deja de reconocer al jugador
// (aunque la página nunca se haya refrescado) y marcar números deja de
// funcionar en silencio.
function attemptRejoin() {
  const session = loadSession();
  if (!session?.roomCode) return; // primera vez en este navegador: pantalla normal de unirse

  socket.emit('player:rejoin', { roomCode: session.roomCode, clientId: CLIENT_ID }, (res) => {
    if (!res?.ok) {
      clearSession();
      return; // se queda en joinScreen, que ya está visible por defecto
    }

    drawnNumbers = res.drawnNumbers || [];
    document.getElementById('playerNameTag').textContent = res.name;
    document.getElementById('roomTag').textContent = res.roomCode;
    renderHistory();

    if (res.cardId != null && res.card) {
      // Ya tenía cartón confirmado: vuelve directo al juego, con sus marcas.
      myCard = res.card;
      showScreen('gameScreen');
      renderCard();
      applyMarkedCells(res.marked || []);
    } else {
      // Se había quedado eligiendo cartón: vuelve a esa pantalla.
      allCardsById = {};
      (res.cards || []).forEach((c) => { allCardsById[c.id] = c.grid; });
      cardsStatusById = {};
      (res.cardsStatus || []).forEach((c) => { cardsStatusById[c.id] = c; });
      showScreen('pickScreen');
      pickRandomCandidate();
    }
  });
}
socket.on('connect', attemptRejoin);

document.getElementById('joinBtn').addEventListener('click', () => {
  const roomCode = document.getElementById('roomInput').value.trim().toUpperCase();
  const name = document.getElementById('nameInput').value.trim();
  const errorBox = document.getElementById('joinError');
  errorBox.textContent = '';

  if (!roomCode) return (errorBox.textContent = 'Ingresa el código de sala.');
  if (!name) return (errorBox.textContent = 'Ingresa tu nombre.');

  socket.emit('player:join', { roomCode, name, clientId: CLIENT_ID }, (res) => {
    if (!res.ok) {
      errorBox.textContent = res.reason === 'room-not-found'
        ? 'No existe esa sala. Revisa el código.'
        : 'No se pudo unir. Intenta de nuevo.';
      return;
    }
    saveSession(res.roomCode, res.name);
    drawnNumbers = res.drawnNumbers || [];
    document.getElementById('playerNameTag').textContent = res.name;
    document.getElementById('roomTag').textContent = res.roomCode;

    allCardsById = {};
    res.cards.forEach((c) => { allCardsById[c.id] = c.grid; });
    cardsStatusById = {};
    res.cardsStatus.forEach((c) => { cardsStatusById[c.id] = c; });

    showScreen('pickScreen');
    renderHistory();
    pickRandomCandidate();
  });
});

// ---------- Selección de cartón ----------
function renderPickGrid() {
  const grid = document.getElementById('pickGrid');
  const ids = Object.keys(allCardsById).map(Number).sort((a, b) => a - b);
  document.getElementById('cardsTotalTag').textContent = ids.length;
  document.getElementById('cardsAvailableTag').textContent =
    ids.filter((id) => !cardsStatusById[id]?.taken).length;

  grid.innerHTML = '';
  ids.forEach((id) => {
    const status = cardsStatusById[id] || { taken: false };
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = id;
    btn.className = 'pick-badge'
      + (status.taken ? ' taken' : '')
      + (id === candidateId ? ' selected' : '');
    btn.addEventListener('click', () => onPickCard(id));
    grid.appendChild(btn);
  });
}

function onPickCard(id) {
  const status = cardsStatusById[id];
  if (status?.taken) {
    showToast(`Este cartón ya lo eligió ${status.takenByName} 😛`);
    return;
  }
  candidateId = id;
  renderPreview();
  renderPickGrid();
}

function renderPreview() {
  document.getElementById('previewIdTag').textContent = candidateId ?? '—';
  const el = document.getElementById('previewCarton');
  el.innerHTML = '';
  const grid = allCardsById[candidateId];
  document.getElementById('confirmCardBtn').disabled = !grid;
  if (!grid) return;

  for (let row = 0; row < 3; row++) {
    for (let col = 0; col < 9; col++) {
      const value = grid[row][col];
      const cell = document.createElement('div');
      cell.className = value == null ? 'cell blank' : 'cell';
      if (value != null) cell.textContent = value;
      el.appendChild(cell);
    }
  }
}

function pickRandomCandidate() {
  const available = Object.keys(allCardsById).map(Number)
    .filter((id) => !cardsStatusById[id]?.taken);
  candidateId = available.length
    ? available[Math.floor(Math.random() * available.length)]
    : null;
  if (!available.length) showToast('No quedan cartones disponibles en esta sala.');
  renderPreview();
  renderPickGrid();
}

document.getElementById('shuffleBtn').addEventListener('click', pickRandomCandidate);

document.getElementById('confirmCardBtn').addEventListener('click', () => {
  if (candidateId == null) return;
  socket.emit('player:confirm-card', { cardId: candidateId }, (res) => {
    if (!res.ok) {
      if (res.reason === 'taken') {
        cardsStatusById[candidateId] = { taken: true, takenByName: res.takenByName };
        showToast(`Este cartón ya lo eligió ${res.takenByName} 😛`);
        candidateId = null;
        renderPreview();
        renderPickGrid();
      } else {
        showToast('No se pudo confirmar el cartón, prueba otro.');
      }
      return;
    }
    myCard = res.card;
    showScreen('gameScreen');
    renderCard();
  });
});

function renderCard() {
  const el = document.getElementById('carton');
  el.innerHTML = '';
  for (let row = 0; row < 3; row++) {
    for (let col = 0; col < 9; col++) {
      const value = myCard[row][col];
      const cell = document.createElement('div');
      cell.dataset.row = row;
      cell.dataset.col = col;
      if (value == null) {
        cell.className = 'cell blank';
      } else {
        cell.className = 'cell playable';
        cell.textContent = value;
        cell.addEventListener('click', () => onCellClick(row, col, cell));
      }
      el.appendChild(cell);
    }
  }
}

function renderHistory() {
  const strip = document.getElementById('historyStrip');
  strip.innerHTML = '';
  drawnNumbers.slice(-12).forEach((n) => {
    const s = document.createElement('span');
    s.textContent = n;
    strip.appendChild(s);
  });
  const last = drawnNumbers[drawnNumbers.length - 1];
  document.getElementById('lastNumber').textContent = last ?? '—';
}

function onCellClick(row, col, cellEl) {
  socket.emit('player:mark', { row, col }, (res) => {
    if (!res.ok) {
      if (res.reason === 'not-drawn') {
        cellEl.classList.add('shake');
        setTimeout(() => cellEl.classList.remove('shake'), 300);
        showToast('Ese número todavía no ha salido.');
      }
      return;
    }
    const key = `${row}-${col}`;
    const isMarked = res.marked.includes(key);
    cellEl.classList.toggle('marked', isMarked);
    const totalPlayable = myCard.flat().filter((v) => v != null).length;
    document.getElementById('markedStatus').textContent = `${res.marked.length}/${totalPlayable} marcados`;
  });
}

socket.on('game:number-drawn', ({ number, history }) => {
  drawnNumbers = history;
  renderHistory();
  scheduleAttentionBlink(number);
});

// Si el número cantado está en mi cartón y a los 3s todavía no lo he marcado,
// la celda parpadea 2 veces para llamar la atención.
function scheduleAttentionBlink(number) {
  if (!myCard) return;
  let target = null;
  for (let row = 0; row < 3; row++) {
    for (let col = 0; col < 9; col++) {
      if (myCard[row][col] === number) target = { row, col };
    }
  }
  if (!target) return;

  setTimeout(() => {
    const cellEl = document.querySelector(
      `#carton .cell[data-row="${target.row}"][data-col="${target.col}"]`
    );
    if (!cellEl || cellEl.classList.contains('marked')) return;
    cellEl.classList.add('attention');
    setTimeout(() => cellEl.classList.remove('attention'), 1000);
  }, 3000);
}

// Mantiene el catálogo de cartones al día en tiempo real mientras se elige
// (así ves de inmediato cuando otro jugador confirma un cartón).
socket.on('room:state', (room) => {
  if (!room.cards || document.getElementById('pickScreen').classList.contains('hidden')) return;

  room.cards.forEach((c) => { cardsStatusById[c.id] = { taken: c.taken, takenByName: c.takenByName }; });

  if (candidateId != null && cardsStatusById[candidateId]?.taken) {
    showToast(`Este cartón ya lo eligió ${cardsStatusById[candidateId].takenByName} 😛`);
    candidateId = null;
    renderPreview();
  }
  renderPickGrid();
});

socket.on('game:win', ({ name, pattern }) => {
  const myName = document.getElementById('playerNameTag').textContent;
  if (name !== myName) return;
  const label = pattern === 'terna' ? '¡Hiciste Terna!' : pattern === 'linea' ? '¡Hiciste Línea!' : '¡CARTÓN LLENO!';
  document.getElementById('patternStatus').textContent = label;
  showToast(label, 4000);
});
</script>
</body>
</html>
