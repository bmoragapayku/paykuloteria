<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lotería digital — Pantalla central</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="/socket.io/socket.io.js"></script>
<style>
  :root{
    --bg-deep: #0a0316;
    --bg-panel: #150b28;
    --violet: #8b5cf6;
    --violet-soft: #c9a6ff;
    --magenta: #e879f9;
    --grad: linear-gradient(90deg, #9b5cf6, #d946ef);
    --grad-text: linear-gradient(180deg, #f6f0ff 0%, #cdaaff 55%, #e879f9 100%);
    --ivory: #f3ecff;
    --mist: #a99cc9;
    --line: #2a1f42;
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; height:100%;
    background:
      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px),
      radial-gradient(circle at 50% -10%, #2a1550 0%, var(--bg-deep) 55%);
    background-size: 26px 26px, 26px 26px, 100% 100%;
    color: var(--ivory);
    font-family: 'Space Grotesk', sans-serif;
    overflow: hidden;
  }
  .num-font{ font-family:'Fraunces', serif; font-variation-settings:'opsz' 144; }
  .grad-text{
    background: var(--grad-text);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }

  /* ---------- Barra superior ---------- */
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding: 22px 40px;
    border-bottom: 1px solid var(--line);
  }
  .brand{ display:flex; align-items:center; gap:16px; }
  .brand .stripe{
    width:6px; height:34px; background: var(--grad); border-radius: 3px;
  }
  .brand h1{ margin:0; font-size:22px; font-weight:500; letter-spacing:0.3px; }
  .brand h1 b{ color: var(--violet-soft); font-weight:700;}
  .brand img{ height:24px; margin-left:6px; }
  .flag-chip{
    display:flex; align-items:center; gap:6px;
    font-size:13px; color: var(--ivory); background:rgba(255,255,255,0.06);
    padding:6px 14px; border-radius:999px; border:1px solid var(--line);
    white-space:nowrap;
  }
  .room-info{ display:flex; align-items:center; gap:22px; }
  .room-code{
    font-size:15px; color:var(--mist);
  }
  .room-code b{
    color: var(--ivory); font-size:20px; letter-spacing: 4px; margin-left:8px;
  }
  .player-count{ font-size:15px; color:var(--mist); }
  .player-count b{ color:var(--violet-soft); }

  /* ---------- Layout principal ---------- */
  main{
    display:grid;
    grid-template-columns: 1.1fr 1.4fr;
    gap: 28px;
    padding: 28px 40px;
    height: calc(100% - 158px);
  }

  /* --- Panel del número --- */
  .stage{
    background: var(--bg-panel);
    border-radius: 24px;
    border: 1px solid var(--line);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    position: relative;
    padding: 20px;
  }
  .ball-wrap{
    width: 340px; height: 340px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #241a3d, #140919 70%);
    border: 4px solid var(--violet);
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 0 0 12px rgba(139,92,246,0.10), 0 0 70px rgba(232,121,249,0.20), 0 20px 60px rgba(0,0,0,0.5);
  }
  #ballNumber{
    font-size: 168px; line-height:1;
    transition: transform .25s ease;
    background: var(--grad-text);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  #ballNumber.pop{ transform: scale(1.12); }
  .stage-caption{
    margin-top: 22px; color: var(--mist); font-size: 15px;
  }
  .history{
    display:flex; flex-wrap:wrap; gap:8px; justify-content:center;
    margin-top: 18px; max-width: 380px;
  }
  .history span{
    width:34px; height:34px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background: var(--line); color: var(--mist); font-size:13px;
  }
  .history span:last-child{ background: var(--grad); color: #fff; }

  /* --- Panel derecho: tablero 1-90 + jugadores --- */
  .side{
    display:flex; flex-direction:column; gap:20px; min-height:0;
  }
  .board-card, .players-card{
    background: var(--bg-panel);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 20px 22px;
  }
  .board-card h2, .players-card h2{
    margin:0 0 14px; font-size:14px; font-weight:500; color: var(--mist);
  }
  .board-card{
    display:flex; flex-direction:column;
    flex: 3 1 0; min-height:0;
  }
  .board-grid{
    display:grid;
    grid-template-columns: repeat(9, 1fr);
    grid-template-rows: repeat(10, 1fr);
    gap: 6px;
    flex: 1; min-height:0;
  }
  .board-grid .cell{
    display:flex; align-items:center; justify-content:center;
    border-radius: 7px;
    background: #23253a;
    color: var(--mist);
    font-size: 15px;
    font-weight: 500;
  }
  .board-grid .cell.called{
    background: var(--grad);
    color: #fff;
    font-weight:700;
  }
  .players-card{ flex: 1 1 0; min-height:0; overflow:auto; }
  .player-row{
    display:flex; align-items:center; gap:12px;
    padding: 8px 0; border-bottom: 1px solid var(--line);
    font-size: 14px;
  }
  .player-row:last-child{ border-bottom:none; }
  .player-row .bar{
    flex:1; height:6px; background:var(--line); border-radius:4px; overflow:hidden;
  }
  .player-row .bar i{ display:block; height:100%; background: var(--grad); }
  .empty-hint{ color: var(--mist); font-size: 14px; }

  /* --- Barra inferior de controles --- */
  footer{
    display:flex; align-items:center; justify-content:center; gap:16px;
    padding: 16px 40px 22px;
  }
  button{
    font-family:'Space Grotesk',sans-serif;
    font-size: 15px; font-weight:500;
    padding: 13px 26px; border-radius: 12px; border:none; cursor:pointer;
    transition: transform .12s ease;
  }
  button:active{ transform: scale(0.96); }
  .btn-primary{ background: var(--grad); color:#fff; }
  .btn-ghost{ background: transparent; color: var(--ivory); border:1px solid var(--line); }
  .btn-ghost.active{ border-color: var(--violet); color: var(--violet-soft); }

  /* --- Lobby (antes de crear sala) --- */
  #lobby{
    height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:26px;
  }
  #lobby h1{ font-size: 30px; margin:0; font-weight:500; }
  #lobby h1 b{ color:var(--violet-soft); }
  #qrHolder{ background:#fff; padding:14px; border-radius: 16px; }
  #joinUrl{ color: var(--mist); font-size:14px; }
  #roomCodeBig{ font-size:46px; letter-spacing:10px;
    background: var(--grad-text); -webkit-background-clip: text; background-clip: text; color: transparent;
  }

  /* --- Overlay de premio --- */
  #winOverlay{
    position: fixed; inset:0; display:none;
    align-items:center; justify-content:center;
    background: rgba(10,10,16,0.86);
    z-index: 50;
    overflow: hidden;
  }
  #winOverlay .card{
    position: relative;
    z-index: 2;
    background: linear-gradient(160deg, #2a1550, #180a2c);
    border: 2px solid var(--violet);
    border-radius: 26px;
    padding: 50px 70px;
    text-align:center;
    box-shadow: 0 0 60px rgba(232,121,249,0.25);
  }
  #winOverlay .pattern{ color: var(--violet-soft); font-size:20px; margin-bottom:10px; }
  #winOverlay .name{ font-size: 46px; font-weight:600; }
  #winOverlay .btn-primary{ margin-top:28px; }
  .confetti-layer{
    position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:1;
  }
  .confetti-piece{
    position:absolute; top:-24px; width:10px; height:16px; border-radius:2px; opacity:0.95;
    animation-name: confettiFall;
    animation-timing-function: cubic-bezier(.36,.2,.6,.9);
    animation-fill-mode: forwards;
  }
  @keyframes confettiFall{
    0%{ transform: translate(0,0) rotate(0deg); opacity:1; }
    100%{ transform: translate(var(--drift), 112vh) rotate(var(--rot)); opacity:0.85; }
  }
  .hidden{ display:none !important; }
</style>
</head>

      <div class="pattern" id="winPattern"></div>
      <div class="name" id="winName"></div>
      <button class="btn-primary" id="winCloseBtn" type="button">Cerrar</button>
    </div>

<script>
const socket = io();
let roomCode = null;

const PATTERN_LABEL = { terna: '¡Hizo Terna!', linea: '¡Hizo Línea!', carton: '¡CARTÓN LLENO!' };

// ---------- Sesión persistente (para no perder la sala al refrescar) ----------
const HOST_CLIENT_ID_KEY = 'loteriaDigitalHost:clientId';
const HOST_SESSION_KEY = 'loteriaDigitalHost:session';

function getHostClientId() {
  let id = localStorage.getItem(HOST_CLIENT_ID_KEY);
  if (!id) {
    id = (crypto.randomUUID ? crypto.randomUUID() : `h-${Date.now()}-${Math.random().toString(36).slice(2)}`);
    localStorage.setItem(HOST_CLIENT_ID_KEY, id);
  }
  return id;
}
const HOST_CLIENT_ID = getHostClientId();

function saveHostSession(code) {
  localStorage.setItem(HOST_SESSION_KEY, JSON.stringify({ roomCode: code }));
}
function loadHostSession() {
  try {
    return JSON.parse(localStorage.getItem(HOST_SESSION_KEY) || 'null');
  } catch {
    return null;
  }
}
function clearHostSession() {
  localStorage.removeItem(HOST_SESSION_KEY);
}

// ---------- Construir tablero 1-90 (9 columnas, igual que las columnas del cartón) ----------
const boardGrid = document.getElementById('boardGrid');
for (let n = 1; n <= 90; n++) {
  const cell = document.createElement('div');
  cell.className = 'cell';
  cell.textContent = n;
  cell.dataset.n = n;
  boardGrid.appendChild(cell);
}

function goToGame(code) {
  roomCode = code;
  document.getElementById('roomCodeTag').textContent = roomCode;
  document.getElementById('lobby').classList.add('hidden');
  document.getElementById('game').classList.remove('hidden');
}

// Reconstruye el tablero y el historial completos a partir de la lista de
// números ya cantados (solo hace falta al recuperar la sesión tras un refresh).
function restoreDrawnNumbers(drawnNumbers) {
  drawnNumbers.forEach((n) => {
    const cell = boardGrid.querySelector(`[data-n="${n}"]`);
    if (cell) cell.classList.add('called');
  });
  const ball = document.getElementById('ballNumber');
  ball.textContent = drawnNumbers[drawnNumbers.length - 1] ?? '—';
  const strip = document.getElementById('historyStrip');
  strip.innerHTML = '';
  drawnNumbers.slice(-10).forEach((n) => {
    const s = document.createElement('span');
    s.textContent = n;
    strip.appendChild(s);
  });
}

function restoreAutoplayButton(autoplay) {
  const btn = document.getElementById('autoplayBtn');
  btn.textContent = `Autoplay: ${autoplay ? 'on' : 'off'}`;
  btn.classList.toggle('active', autoplay);
}

// Corre en CADA conexión del socket, no solo la primera: un corte de red
// breve (WiFi que titubea, el celular cambiando de red, la pestaña en
// segundo plano) hace que Socket.IO reconecte solo con un socket.id
// nuevo — sin este handshake, el servidor deja de reconocer al host
// (aunque la página nunca se haya refrescado) y "Cantar número" se queda
// sin hacer nada.
function attemptHostRejoin() {
  const session = loadHostSession();
  if (!session?.roomCode) return; // primera vez: lobby normal

  socket.emit('host:rejoin', { roomCode: session.roomCode, clientId: HOST_CLIENT_ID }, (res) => {
    if (!res?.ok) {
      clearHostSession();
      return; // se queda en el lobby, que ya está visible por defecto
    }
    goToGame(res.room.code);
    restoreDrawnNumbers(res.room.drawnNumbers || []);
    restoreAutoplayButton(res.room.autoplay);
    applyRoomState(res.room);
  });
}
socket.on('connect', attemptHostRejoin);

document.getElementById('createRoomBtn').addEventListener('click', () => {
  const cardCount = Number(document.getElementById('cardCountSelect').value);
  socket.emit('host:create', { cardCount, clientId: HOST_CLIENT_ID }, (res) => {
    if (!res.ok) return;
    roomCode = res.room.code;
    saveHostSession(roomCode);
    const joinUrl = `${location.origin}/player.html?room=${roomCode}`;

    document.getElementById('roomCodeBig').textContent = roomCode;
    document.getElementById('joinUrl').textContent = joinUrl;
    document.getElementById('qrHolder').innerHTML = '';
    new QRCode(document.getElementById('qrHolder'), { text: joinUrl, width: 220, height: 220 });

    // Se queda mostrando el QR y el código hasta que el host decida seguir
    // (la gente necesita tiempo real para escanear, no un par de segundos).
    document.getElementById('lobbySetup').classList.add('hidden');
    document.getElementById('lobbyRoomBox').classList.remove('hidden');
    document.getElementById('roomCodeTag').textContent = roomCode;
  });
});

document.getElementById('continueToGameBtn').addEventListener('click', () => {
  document.getElementById('lobby').classList.add('hidden');
  document.getElementById('game').classList.remove('hidden');
});

document.getElementById('drawBtn').addEventListener('click', () => {
  socket.emit('host:draw-next', {});
});

document.getElementById('autoplayBtn').addEventListener('click', () => {
  socket.emit('host:toggle-autoplay', {}, (res) => {
    restoreAutoplayButton(res.autoplay);
  });
});

document.getElementById('resetBtn').addEventListener('click', () => {
  if (!confirm('¿Reiniciar y cerrar esta sala?')) return;
  clearHostSession();
  socket.emit('host:reset', {}, () => location.reload());
});

socket.on('game:number-drawn', ({ number, history }) => {
  const ball = document.getElementById('ballNumber');
  ball.textContent = number;
  ball.classList.remove('pop');
  void ball.offsetWidth; // reinicia animación
  ball.classList.add('pop');

  const cell = boardGrid.querySelector(`[data-n="${number}"]`);
  if (cell) cell.classList.add('called');

  const strip = document.getElementById('historyStrip');
  strip.innerHTML = '';
  history.slice(-10).forEach((n) => {
    const s = document.createElement('span');
    s.textContent = n;
    strip.appendChild(s);
  });
});

function applyRoomState(room) {
  document.getElementById('playerCount').textContent = room.players.length;
  const lobbyCountTag = document.getElementById('lobbyPlayerCount');
  if (lobbyCountTag) {
    lobbyCountTag.textContent = `${room.players.length} jugador${room.players.length === 1 ? '' : 'es'} conectado${room.players.length === 1 ? '' : 's'}`;
  }
  const takenCount = room.cards.filter((c) => c.taken).length;
  document.getElementById('cardsTakenTag').textContent = `${takenCount}/${room.cards.length}`;
  const list = document.getElementById('playersList');
  if (room.players.length === 0) {
    list.innerHTML = '<div class="empty-hint">Esperando jugadores…</div>';
    return;
  }
  list.innerHTML = '';
  room.players.forEach((p) => {
    const row = document.createElement('div');
    row.className = 'player-row';
    const pct = Math.min(100, (p.markedCount / 15) * 100);
    row.innerHTML = `<span style="width:120px; overflow:hidden; text-overflow:ellipsis;">${p.name}</span>
      <div class="bar"><i style="width:${pct}%"></i></div>`;
    list.appendChild(row);
  });
}

socket.on('room:state', applyRoomState);

// ---------- Overlay de premio: confeti + cierre manual ----------
const CONFETTI_COLORS = ['#9b5cf6', '#e879f9', '#c9a6ff', '#f6f0ff', '#D52B1E', '#0039A6'];

function launchConfetti(count = 90) {
  const layer = document.getElementById('confettiLayer');
  layer.innerHTML = '';
  for (let i = 0; i < count; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = `${Math.random() * 100}%`;
    piece.style.background = CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)];
    piece.style.animationDuration = `${2.4 + Math.random() * 2.2}s`;
    piece.style.animationDelay = `${Math.random() * 0.7}s`;
    piece.style.setProperty('--rot', `${Math.random() * 360}deg`);
    piece.style.setProperty('--drift', `${Math.random() * 160 - 80}px`);
    layer.appendChild(piece);
  }
}

function closeWinOverlay() {
  document.getElementById('winOverlay').style.display = 'none';
  document.getElementById('confettiLayer').innerHTML = '';
}
document.getElementById('winCloseBtn').addEventListener('click', closeWinOverlay);

socket.on('game:win', ({ name, pattern }) => {
  document.getElementById('winPattern').textContent = PATTERN_LABEL[pattern] || 'Premio';
  document.getElementById('winName').textContent = name;
  document.getElementById('winOverlay').style.display = 'flex';
  launchConfetti();
});

socket.on('game:pool-empty', () => {
  alert('Se cantaron los 90 números.');
});

socket.on('room:host-left', () => {
  clearHostSession();
});
</script>
